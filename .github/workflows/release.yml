name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job below can write, and only on pushes to main.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/HelloCleanUp/HelloCleanUp.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          [xml]$manifest = Get-Content src/HelloCleanUp/app.manifest
          $m = $manifest.assembly.assemblyIdentity.version
          if ($m -ne "$v.0") {
            Write-Error "Версия в app.manifest ($m) не совпадает с HelloCleanUp.csproj ($v.0). Поправь assemblyIdentity."
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/HelloCleanUp/HelloCleanUp.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src/HelloCleanUp/bin/Release/net48/HelloCleanUp.exe out/HelloCleanUp.exe
          $hash = (Get-FileHash out/HelloCleanUp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HelloCleanUp.exe" | Set-Content -Encoding ascii out/HelloCleanUp.exe.sha256
          Get-Item out/HelloCleanUp.exe | Format-List Name, Length
          Get-Content out/HelloCleanUp.exe.sha256

      # Runs the real exe on Windows without changing anything: reads installed apps through the Appx module,
      # previews every tweak and app, scans every cleanup target. Catches broken PowerShell before a release.
      - name: Smoke test (dry run)
        shell: pwsh
        run: |
          $exe = (Resolve-Path out/HelloCleanUp.exe).Path
          function Invoke-Cli([string[]]$cliArgs, [string]$name) {
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            $p = Start-Process -FilePath $exe -ArgumentList ($cliArgs + "/log:$log") -Wait -PassThru
            Write-Host "===== HelloCleanUp $($cliArgs -join ' ')  →  код выхода $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Host } else { Write-Host "(журнала нет)" }
            if ($p.ExitCode -ne 0) { throw "HelloCleanUp $($cliArgs -join ' ') завершился с кодом $($p.ExitCode)" }
            return $log
          }
          $list = Invoke-Cli @('/list') 'list'
          if (-not (Select-String -Path $list -Pattern 'candy-crush' -Quiet)) { throw 'в /list нет раздела приложений' }
          if (Select-String -Path $list -Pattern 'PowerShell не вернул' -Quiet) { throw 'список приложений не прочитался' }
          Invoke-Cli @('/tweaks:all', '/apps:all', '/deprovision', '/clean:all', '/dry-run') 'dry-run' | Out-Null

          # Real remove → restore cycle on this throwaway runner, with an app Windows images usually carry.
          $installed = '\*\+ feedback-hub'
          if (Select-String -Path $list -Pattern $installed -Quiet) {
            Invoke-Cli @('/apps:feedback-hub') 'remove' | Out-Null
            $after = Invoke-Cli @('/list') 'list-after-remove'
            if (Select-String -Path $after -Pattern $installed -Quiet) { throw 'Центр отзывов не удалился' }
            Invoke-Cli @('/revert:feedback-hub') 'restore' | Out-Null
            $back = Invoke-Cli @('/list') 'list-after-restore'
            if (-not (Select-String -Path $back -Pattern $installed -Quiet)) { throw 'Центр отзывов не вернулся' }
            Write-Host 'Удаление и возврат приложения работают.'
          } else {
            Write-Host '::notice::На раннере нет Центра отзывов — проверка удаления и возврата пропущена'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: HelloCleanUp-${{ steps.ver.outputs.version }}
          path: |
            out/HelloCleanUp.exe
            out/HelloCleanUp.exe.sha256

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: HelloCleanUp-${{ needs.build.outputs.version }}
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # A published release is never overwritten: a new exe needs a new <Version> in HelloCleanUp.csproj.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Релиз $TAG уже есть — не трогаю его. Чтобы выпустить новую сборку, подними <Version> в HelloCleanUp.csproj и app.manifest."
            exit 0
          fi
          gh release create "$TAG" out/HelloCleanUp.exe out/HelloCleanUp.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "Hello, CleanUp. $TAG" \
            --notes-file RELEASE_NOTES.md
